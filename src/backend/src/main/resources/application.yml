server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: pharma-manager-core-api
  datasource:
    url: ${CORE_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/pharma_core}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
ai:
  backend-url: ${AI_BACKEND_URL:http://127.0.0.1:8000}
