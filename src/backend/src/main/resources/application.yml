server:
  port: ${SERVER_PORT:8080}
  tomcat:
    max-part-count: 50
    max-http-form-post-size: 12MB
spring:
  application:
    name: pharma-manager-core-api
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    url: ${CORE_DATABASE_URL:jdbc:postgresql://127.0.0.1:5432/pharma_core}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://127.0.0.1:8081/realms/pharma-manager}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
ai:
  backend-url: ${AI_BACKEND_URL:http://127.0.0.1:8000}
pharma:
  consent-version: ${CONSENT_VERSION:2026-07-27}
